<!DOCTYPE html>
<html>
<head>
    <title>Search Rooms</title>
</head>
<body>

    <h1>Search Available Rooms</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Date:</label><br>
        <input type="date" name="date" value="{{ date }}" required><br><br>

        <label>Start Time:</label><br>
        <input type="time" name="start_time" value="{{ start_time }}" required><br><br>

        <label>End Time:</label><br>
        <input type="time" name="end_time" value="{{ end_time }}" required><br><br>

        <button type="submit">Search</button>
    </form>

    <hr>

    <h2>Available Rooms</h2>

    {% for room in rooms %}
    <p>
        Room: {{ room['room_code'] }} |
        Building: {{ room['building'] }} |
        Capacity: {{ room['capacity'] }} |
        Status: {{ room['status'] }}

        <a href="/bookroom/{{ room['id'] }}">
            <button>Book Room</button>
        </a>
    </p>
    {% endfor %}

    <br>
    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
